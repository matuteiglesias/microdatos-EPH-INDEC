name: Scheduled EPH release probe

on:
  workflow_dispatch:
    inputs:
      year:
        description: Optional explicit year override
        required: false
        type: string
      quarter:
        description: Optional explicit quarter override (Q1..Q4)
        required: false
        type: string
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  id-token: write  # Restricted to the metadata exporter by the GCP OIDC condition

concurrency:
  group: scheduled-eph-release-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture producer start time
        run: echo "PRODUCER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded extractor
        run: python -m pip install -e .

      - name: Verify offline invariants and synthetic publication first
        id: checks
        run: |
          make check
          make smoke

      - name: Resolve the quarter that should already be public
        id: target
        env:
          MANUAL_YEAR: ${{ inputs.year }}
          MANUAL_QUARTER: ${{ inputs.quarter }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta

          manual_year = (os.environ.get("MANUAL_YEAR") or "").strip()
          manual_quarter = (os.environ.get("MANUAL_QUARTER") or "").strip().upper()

          if manual_year or manual_quarter:
              if not manual_year or manual_quarter not in {"Q1", "Q2", "Q3", "Q4"}:
                  raise SystemExit("Manual override requires year and quarter=Q1..Q4")
              year = int(manual_year)
              quarter = int(manual_quarter[1])
          else:
              today = date.today()
              candidates = []
              for year0 in range(today.year - 3, today.year + 1):
                  for quarter0, end in {
                      1: date(year0, 3, 31),
                      2: date(year0, 6, 30),
                      3: date(year0, 9, 30),
                      4: date(year0, 12, 31),
                  }.items():
                      # Historical publication lag is roughly 130 days. Probe only a
                      # quarter old enough that absence/ambiguity is operationally useful.
                      if today >= end + timedelta(days=130):
                          candidates.append((end, year0, quarter0))
              if not candidates:
                  raise SystemExit("No quarter is old enough for the 130-day publication probe")
              _, year, quarter = max(candidates)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"EPH_YEAR={year}\n")
              fh.write(f"EPH_QUARTER=Q{quarter}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"year={year}\n")
              fh.write(f"quarter=Q{quarter}\n")
              fh.write(f"selection={'manual_override' if manual_year else 'lag_130d'}\n")
          print(f"Resolved probe target: {year} Q{quarter}")
          PY

      - name: Retrieve and materialize exact quarter candidate
        id: probe
        run: |
          mkdir -p "$RUNNER_TEMP/eph-probe"
          make probe YEAR="$EPH_YEAR" QUARTER="$EPH_QUARTER" OUT_DIR="$RUNNER_TEMP/eph-probe"

      - name: Package deterministic durable candidate
        id: package
        run: |
          release=$(find "$RUNNER_TEMP/eph-probe" -mindepth 1 -maxdepth 1 -type d ! -name .source | sort | tail -1)
          test -n "$release"
          python -m eph_extractor.publication \
            "$release" \
            --source-dir "$RUNNER_TEMP/eph-probe/.source" \
            --output "$RUNNER_TEMP/eph-publication"
          python - <<'PY'
          import json, os
          from pathlib import Path
          discovery = json.loads((Path(os.environ["RUNNER_TEMP"]) / "eph-publication" / "discovery.json").read_text())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"PUBLICATION_TAG={discovery['github_release']['tag']}\n")
              fh.write(f"PUBLICATION_ASSET={discovery['github_release']['asset_name']}\n")
              fh.write(f"PUBLICATION_RELEASE_ID={discovery['release_id']}\n")
          PY

      - name: Publish or verify immutable GitHub Release transport
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/eph-publication/$PUBLICATION_ASSET"
          discovery="$RUNNER_TEMP/eph-publication/discovery.json"
          if ! gh release view "$PUBLICATION_TAG" >/dev/null 2>&1; then
            gh release create "$PUBLICATION_TAG" "$asset" "$discovery" \
              --prerelease --target "$GITHUB_SHA" \
              --title "$PUBLICATION_RELEASE_ID (candidate)" \
              --notes "Immutable candidate transport for publicdata.eph-microdata@1. Candidate publication is not downstream scientific approval."
          fi
          # Newly created and pre-existing tags use the exact same remote proof.
          test "$(gh release view "$PUBLICATION_TAG" --json isPrerelease --jq '.isPrerelease')" = true
          mkdir -p "$RUNNER_TEMP/eph-verified-download"
          gh release download "$PUBLICATION_TAG" -p "$PUBLICATION_ASSET" -p discovery.json \
            -D "$RUNNER_TEMP/eph-verified-download"
          cmp "$asset" "$RUNNER_TEMP/eph-verified-download/$PUBLICATION_ASSET"
          cmp "$discovery" "$RUNNER_TEMP/eph-verified-download/discovery.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "eph-publication"
          doc = json.loads((root / "discovery.json").read_text())
          asset_path = root / doc["github_release"]["asset_name"]
          def digest(p):
              h = hashlib.sha256()
              with p.open("rb") as fp:
                  for chunk in iter(lambda: fp.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          attestation = {
              "schema": "eph-candidate-transport-verification/v1",
              "status": "verified", "verification": "github_download_cmp",
              "prerelease": True, "release_id": doc["release_id"],
              "tag": doc["github_release"]["tag"],
              "asset_sha256": digest(asset_path),
              "discovery_sha256": digest(root / "discovery.json"),
          }
          (root / "transport-verified.json").write_text(json.dumps(attestation, sort_keys=True, indent=2) + "\n")
          PY

      - name: Emit semantic EPH receipt (even on partial runs)
        id: eph_receipt
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_STATE: ${{ job.status }}
          TARGET_YEAR: ${{ steps.target.outputs.year }}
          TARGET_QUARTER: ${{ steps.target.outputs.quarter }}
          TARGET_SELECTION: ${{ steps.target.outputs.selection }}
          MANUAL_YEAR: ${{ inputs.year }}
          MANUAL_QUARTER: ${{ inputs.quarter }}
          CHECKS_STATE: ${{ steps.checks.outcome }}
          TARGET_STATE: ${{ steps.target.outcome }}
          PROBE_STATE: ${{ steps.probe.outcome }}
          PACKAGE_STATE: ${{ steps.package.outcome }}
          PUBLISH_STATE: ${{ steps.publish.outcome }}
        run: |
          started="${PRODUCER_STARTED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          mkdir -p "$RUNNER_TEMP/eph-receipt"
          python3 scripts/emit_eph_release_receipt.py \
            --scheduler-run-id "$RUN_ID" --run-attempt "$ATTEMPT" \
            --event-name "$EVENT_NAME" --job-status "$JOB_STATE" \
            --started-at "$started" --finished-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --year "$TARGET_YEAR" --quarter "$TARGET_QUARTER" --selection "$TARGET_SELECTION" \
            --manual-year "$MANUAL_YEAR" --manual-quarter "$MANUAL_QUARTER" \
            --step-checks "$CHECKS_STATE" --step-target "$TARGET_STATE" \
            --step-probe "$PROBE_STATE" --step-package "$PACKAGE_STATE" --step-publish "$PUBLISH_STATE" \
            --probe-dir "$RUNNER_TEMP/eph-probe" --publication-dir "$RUNNER_TEMP/eph-publication" \
            --output "$RUNNER_TEMP/eph-receipt/producer-run-receipt.json"

      - name: Authenticate EPH metadata exporter with OIDC
        id: gcp_auth
        if: always() && steps.eph_receipt.outcome == 'success' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: estate-observability-510700
          workload_identity_provider: projects/456183330588/locations/global/workloadIdentityPools/estate-producer-github/providers/eph-release-probe-master-oidc
          service_account: estate-eph-receipt-writer@estate-observability-510700.iam.gserviceaccount.com

      - name: Export semantic receipt to dedicated Cloud Logging
        id: gcp_export
        if: always() && steps.eph_receipt.outcome == 'success' && steps.gcp_auth.outcome == 'success'
        continue-on-error: true
        run: |
          python -m pip install 'google-auth>=2.30,<3' 'requests>=2.31,<3'
          python3 scripts/export_eph_release_gcp.py \
            --receipt "$RUNNER_TEMP/eph-receipt/producer-run-receipt.json" \
            --scheduler-run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --write

      - name: Summarize telemetry separately from EPH candidate validity
        if: always()
        env:
          RECEIPT_STATUS: ${{ steps.eph_receipt.outcome }}
          AUTH_STATUS: ${{ steps.gcp_auth.outcome }}
          EXPORT_STATUS: ${{ steps.gcp_export.outcome }}
        run: |
          if [ "$EXPORT_STATUS" = success ]; then
            echo "Canonical EPH receipt exported to dedicated Cloud Logging." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "EPH receipt transport: receipt=$RECEIPT_STATUS, auth=$AUTH_STATUS, export=$EXPORT_STATUS. Candidate scientific status is unchanged." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::EPH receipt telemetry unavailable; science/publication status is unchanged."
          fi

      - name: Upload recoverable semantic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eph-producer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eph-receipt/producer-run-receipt.json
          retention-days: 14
          if-no-files-found: warn

      - name: Summarize candidate
        if: always()
        run: |
          {
            echo "## Scheduled EPH release probe"
            echo
            echo "Target: **${EPH_YEAR:-unresolved} ${EPH_QUARTER:-unresolved}**"
            echo
            echo "Successful exact-quarter materialization is published as a content-addressed candidate release. Stable source identity is separated from volatile retrieval-run evidence so an unchanged upstream archive can be verified byte-for-byte on rerun."
            echo
            echo "Candidate publication does not imply downstream scientific approval. Actions artifacts remain run evidence; the GitHub prerelease is the durable cross-repository transport."
            echo
            if [ -d "$RUNNER_TEMP/eph-probe" ]; then
              echo '```text'
              find "$RUNNER_TEMP/eph-probe" "$RUNNER_TEMP/eph-publication" -maxdepth 3 -type f -printf '%p\n' 2>/dev/null | sort | head -150
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact candidate and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eph-${{ steps.target.outputs.year }}-${{ steps.target.outputs.quarter }}-candidate
          path: |
            ${{ runner.temp }}/eph-probe
            ${{ runner.temp }}/eph-publication
          if-no-files-found: warn
          retention-days: 14
