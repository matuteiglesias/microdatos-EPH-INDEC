schema_version: 1
id: publicdata.eph.acquire
repository:
  id: repo.microdatos-eph-indec
  github: matuteiglesias/microdatos-EPH-INDEC
domain: public-data
system: publicdata.indec-household-surveys
role: indec-household-survey-microdata-acquisition-producer
lifecycle: active
authority:
  status: proven-live-eph-plus-engho-capability
  owns:
  - upstream EPH microdata acquisition and raw-format conversion
  - upstream ENGHo 2017/18 public-use microdata acquisition and custody normalization
  - versioned acquisition outputs, exact source identity, schema inventory and provenance
  does_not_own:
  - analytical merging, feature engineering, deflation, targets, or models
  - ENGHo reference-population selection, expenditure shares or Engel coefficients
  - food/non-food scientific classification, CBA/CBT construction or poverty measurement
interfaces:
  consumes: []
  produces:
  - artifact:publicdata.eph-microdata@1
  - artifact:publicdata.indec-engho-microdata/v1
canonical_commands:
- make install
- make check
- make smoke
- make probe YEAR=2024 QUARTER=Q3 OUT_DIR=/tmp/eph-probe
- make engho-probe ENGHO_OUT_DIR=/tmp/engho-2017-18-probe
generated_paths:
- external output root/eph-YEAR-qN-SOURCEHASH/
- external output root/engho-2017-2018-HASH/
