  last_verified: '2026-09-28'
  command: make check && make smoke
  evidence:
  - existing EPH scheduled live acquisition/materialization remains unchanged
  - ENGHo fixed five-source contract, deterministic publication and synthetic negative-path tests are implemented
  - ENGHo real-data published-dimension commissioning is explicit and never fabricated in hosted CI
  - real M1 release engho-2017-2018-ff05578d65ae passed deterministic validation and re-extraction under producer commit 22f15527c1f504e924032df270b4e1d05777fc0f
  - M1 inventory: households 21,547; persons 68,725; expenditures 901,804; articles 1,224; replicate weights 21,547
  - M1 explicit warning: persons count is 50 above the manual commissioning target; unique source rows are retained without recoding/filtering
  - durable compact receipt: docs/ENGHO_M1_COMMISSIONING_2026-09-28.md
  unknowns:
